name: App Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/**'

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: public-ci-synthetic-key
      VITE_FIREBASE_AUTH_DOMAIN: example.invalid
      VITE_FIREBASE_PROJECT_ID: demo-optiform-nutrition
      VITE_FIREBASE_STORAGE_BUCKET: demo-optiform-nutrition.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: public-ci-synthetic-app
      VITE_ENABLE_BETA_TOOLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run format:check
