name: Firebase Emulator Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/**'

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firebase-emulators
        env:
          GCLOUD_PROJECT: demo-optiform-nutrition
          OPEN_FOOD_FACTS_USER_AGENT: Optiform-Public-CI/1.0 (tests@example.invalid)
